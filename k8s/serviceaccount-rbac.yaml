# 沙箱控制面的 K8s 身份：只管 sandbox 命名空间里的 pod。动词照 src/k8s.ts 实际调的 API 写。
# namespace 不写死，由 apply 时的 -n 决定：
#   kubectl apply -n <sandbox-ns> -f k8s/serviceaccount-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-control-plane
  labels:
    app.kubernetes.io/name: sandbox-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-control-plane
  labels:
    app.kubernetes.io/name: sandbox-control-plane
rules:
  # pod 生命周期：create（acquire / 预热池补齐）、get（getPod / 等 Ready / 等删净）、
  # list + watch（reaper / 池子对账 / observer 的 watch 流）、delete（release / reaper / 池子让位）、
  # patch（池子 pod 被认领时改 label + annotation：markPodClaimed / 池子对账）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # observer 边跑边收 + 终态抢救日志
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # API-server pod-proxy 兜底通道（k8s.ts podProxyBase：pod IP 不通时经 API server 打 AIO，GET + POST）
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get", "create"]
  # observer 轮询命名空间 v1 Events（listEvents）
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # acquire 前的配额预检 + /internal/control-plane/health 的容量（listResourceQuotas）
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-control-plane
  labels:
    app.kubernetes.io/name: sandbox-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-control-plane
subjects:
  - kind: ServiceAccount
    name: sandbox-control-plane
