# 模板：复制后填值再 apply，别把真值提交进仓库。
#   kubectl apply -n <sandbox-ns> -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-control-plane-env
  labels:
    app.kubernetes.io/name: sandbox-control-plane
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DBNAME"
  SANDBOX_CP_INBOUND_SECRET: "REPLACE_ME"
  # 回收 / 池子 / 寿命（不配 = 对应功能不开）
  SANDBOX_IDLE_TTL_S: "1800"
  SANDBOX_REAPER_INTERVAL_S: "300"
  # SANDBOX_MAX_AGE_S: "14400"
  # SANDBOX_POOL_DESIRED: "2"
  # SANDBOX_POOL_INTERVAL_S: "60"
  # 集群外运行时才需要显式 K8s 凭据；集群内走 ServiceAccount，这四项留空
  # SANDBOX_K8S_SERVER_URL: ""
  # SANDBOX_K8S_TOKEN: ""
  # SANDBOX_K8S_NAMESPACE: ""
  # SANDBOX_K8S_CA: ""
